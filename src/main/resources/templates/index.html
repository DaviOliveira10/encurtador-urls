<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encurtador de URLs</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b;
        }
        main {
            width: 100%; max-width: 560px; margin: 16px; padding: 32px;
            background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }
        h1 { margin: 0 0 4px; color: #1f4e79; }
        .sub { margin: 0 0 24px; color: #64748b; }
        form { display: flex; gap: 8px; }
        input[type=text] {
            flex: 1; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px;
        }
        button {
            padding: 12px 18px; font-size: 16px; border: 0; border-radius: 8px;
            background: #2e75b6; color: #fff; cursor: pointer;
        }
        button:hover { background: #1f4e79; }
        .erro { margin-top: 16px; padding: 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; }
        .resultado {
            margin-top: 20px; padding: 16px; border-radius: 8px; background: #e0f2fe;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .resultado a { flex: 1; word-break: break-all; color: #0c4a6e; font-weight: bold; }
    </style>
</head>
<body>
<main>
    <h1>Encurtador de URLs</h1>
    <p class="sub">Cole um link longo e receba um curto.</p>

    <form th:action="@{/encurtar}" method="post">
        <input type="text" name="url" th:value="${urlDigitada}" placeholder="https://..." required autofocus>
        <button type="submit">Encurtar</button>
    </form>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="resultado" th:if="${linkCurto}">
        <a id="linkCurto" th:href="${linkCurto}" th:text="${linkCurto}" target="_blank"></a>
        <button type="button" onclick="copiar(this)">Copiar</button>
    </div>
</main>

<script>
    function copiar(botao) {
        const texto = document.getElementById('linkCurto').textContent;
        navigator.clipboard.writeText(texto).then(() => {
            botao.textContent = 'Copiado!';
            setTimeout(() => botao.textContent = 'Copiar', 1500);
        });
    }
</script>
</body>
</html>
