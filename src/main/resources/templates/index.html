<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encurtador de URLs</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e2e8f0;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --success-bg: #dbeafe;
            --success-text: #0c4a6e;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --border: #334155;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
            --success-bg: #0c4a6e;
            --success-text: #7dd3fc;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        header {
            padding: 20px 32px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow);
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
        }
        main {
            flex: 1;
            width: 100%; max-width: 560px; margin: 16px auto; padding: 40px;
            background: var(--bg-secondary); border-radius: 20px; box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        h1 { 
            margin: 0 0 8px; 
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub { 
            margin: 0 0 32px; 
            color: var(--text-secondary);
            font-size: 16px;
        }
        form { 
            display: flex; gap: 12px; 
        }
        @media (max-width: 480px) {
            form { flex-direction: column; }
        }
        input[type=text] {
            flex: 1; padding: 14px 16px; font-size: 16px; border: 2px solid var(--border); border-radius: 12px;
            background: var(--bg-primary); color: var(--text-primary);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type=text]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        input[type=text]::placeholder {
            color: var(--text-secondary);
        }
        button {
            padding: 14px 24px; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px;
            background: var(--accent); color: #fff; cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        button:hover { 
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .erro { 
            margin-top: 20px; padding: 14px 16px; border-radius: 12px; 
            background: var(--error-bg); color: var(--error-text);
            font-weight: 500;
        }
        .resultado {
            margin-top: 24px; padding: 20px; border-radius: 12px; 
            background: var(--success-bg); color: var(--success-text);
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .resultado a { 
            flex: 1; word-break: break-all; 
            color: var(--success-text); font-weight: 600; text-decoration: none;
        }
        .resultado a:hover {
            text-decoration: underline;
        }
        footer {
            padding: 24px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema">
        <span id="sun-icon" style="font-size: 22px;">☀️</span>
        <span id="moon-icon" style="font-size: 22px; display: none;">🌙</span>
    </button>
</header>

<main>
    <h1>Encurtador de URLs</h1>
    <p class="sub">Cole um link longo e receba um curto.</p>

    <form th:action="@{/encurtar}" method="post">
        <input type="text" name="url" th:value="${urlDigitada}" placeholder="https://..." required autofocus>
        <button type="submit">Encurtar</button>
    </form>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="resultado" th:if="${linkCurto}">
        <a id="linkCurto" th:href="${linkCurto}" th:text="${linkCurto}" target="_blank"></a>
        <button type="button" onclick="copiar(this)">Copiar</button>
    </div>
</main>

<footer>
    Desenvolvido por <a href="https://github.com/DaviOliveira10" target="_blank">DaviOliveira10</a>
</footer>

<script>
    function copiar(botao) {
        const texto = document.getElementById('linkCurto').textContent;
        navigator.clipboard.writeText(texto).then(() => {
            botao.textContent = 'Copiado!';
            setTimeout(() => botao.textContent = 'Copiar', 1500);
        });
    }

    function toggleTheme() {
        const html = document.documentElement;
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }
    }

    (function() {
        const savedTheme = localStorage.getItem('theme');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }
    })();
</script>
</body>
</html>
